[project]
name = "makers-loan-analytics"
version = "1.0.0"
description = "Análisis reproducible de solicitudes de préstamo"
requires-python = ">=3.13"
dependencies = ["pandas>=2.3,<4", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
