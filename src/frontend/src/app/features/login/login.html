<main class="login-page"><section class="login-card" aria-labelledby="login-title">
  <h1 id="login-title">Gestión de préstamos</h1><p>Ingresa para solicitar un préstamo o gestionar solicitudes.</p>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    <label>Correo electrónico<input type="email" formControlName="email" autocomplete="username" />@if (form.controls.email.touched && form.controls.email.invalid) { <span class="error">Ingresa un correo válido.</span> }</label>
    <label>Contraseña<input type="password" formControlName="password" autocomplete="current-password" />@if (form.controls.password.touched && form.controls.password.invalid) { <span class="error">La contraseña es obligatoria.</span> }</label>
    @if (error()) { <div class="notice error-box" role="alert">{{ error() }}</div> }
    <button class="primary" type="submit" [disabled]="loading()">{{ loading() ? 'Ingresando…' : 'Ingresar' }}</button>
  </form>
  <div class="demo"><strong>Cuentas demo</strong><br />Usuario: usuario@test.com<br />Administrador: admin@test.com<br />Contraseña: Demo123456!</div>
</section></main>
