services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makers_loans}
      POSTGRES_USER: ${POSTGRES_USER:-makers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makers_local_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
  api:
    build:
      context: .
      dockerfile: src/backend/Makers.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-makers_loans};Username=${POSTGRES_USER:-makers};Password=${POSTGRES_PASSWORD:-makers_local_password}
      Jwt__Key: ${JWT_KEY:-development-only-key-change-me-32-characters-minimum}
      Seed__Password: ${SEED_PASSWORD:-Demo123456!}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports: ["4200:8080"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
